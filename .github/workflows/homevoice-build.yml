# HomeVoice's Tasmota build, run on GitHub's machines.
#
# DROP THIS FILE AT:  .github/workflows/homevoice-build.yml  (in YOUR fork)
#
# Why this exists: building Tasmota locally needs ~400 MB of toolchain
# downloads that a mobile-data connection keeps killing. This runs the SAME
# `platformio run -e tasmota32` on GitHub's runners — datacenter bandwidth,
# free for public repos — and hands back only the ~2 MB binaries.
#
# Trigger is MANUAL (workflow_dispatch): nothing builds until you press the
# button, and pushes to the fork never surprise-build anything.
#
# THE TWO "PROVE IT" STEPS are here because the first build came out
# without RC522: the override file was not where the compiler looks, the
# build went green anyway, and the miss only showed up after a download,
# an OTA and a `GPIOs` on the board. A green run must now MEAN the driver
# is in — so the run fails before the build if the override is missing,
# and fails after the build if the linker map has no RC522 in it.

name: Build HomeVoice Tasmota

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this fork (the branch you run it on)
        uses: actions/checkout@v5

      # The compiler reads tasmota/user_config_override.h and nowhere else.
      # A file at the repo root, or on another branch, is silently ignored
      # and the build is stock. So: refuse to build unless it is exactly
      # here, and print it so the run log shows what was compiled in.
      - name: Prove the override is where the compiler looks
        run: |
          test -f tasmota/user_config_override.h || {
            echo "::error::tasmota/user_config_override.h is missing on this branch — the build would be stock."
            exit 1
          }
          echo "--- tasmota/user_config_override.h ---"
          cat tasmota/user_config_override.h

      - name: Python for PlatformIO
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build tasmota32 (with user_config_override.h in this fork)
        run: platformio run -e tasmota32

      # Tasmota links with -Wl,-Map, so the map lists every symbol and
      # object file that made it into the binary. Each driver the override
      # asks for must leave its trace there; zero hits means it was NOT
      # compiled in no matter what the override says — and the run must say
      # so here, not on a board later. One marker per driver, so a
      # misspelled define fails ITS line by name instead of hiding behind
      # the others.
      - name: Prove every requested driver is inside the binary
        run: |
          MAP=.pio/build/tasmota32/firmware.map
          test -f "$MAP" || { echo "::error::no linker map at $MAP"; exit 1; }
          FAILED=0
          require() {  # require <label> <grep -E pattern>
            HITS=$(grep -Eci "$2" "$MAP" || true)
            echo "$1: $HITS symbol(s) in the linker map"
            if [ "$HITS" -eq 0 ]; then
              echo "::error::$1 is NOT in this build — check its define in tasmota/user_config_override.h"
              FAILED=1
            fi
          }
          require "RC522 card reader"      'mfrc522'
          require "Character LCD"          'xdsp_01|liquidcrystal'
          require "TM1637 seven-segment"   'tm1637'
          require "MAX7219 dot matrix"     'max7219'
          require "MPU6050 IMU"            'mpu6050'
          exit $FAILED

      # THE SWEEP'S PROOFS (2026-08-25). The linker map can lie about a
      # sensor whose object file compiles empty behind its #ifdef -- so
      # these check the BUILT BINARY for each driver's own tele-SENSOR
      # name string, which only exists when the driver's code does. This
      # is check_firmware.py's name-vs-driver method promoted to CI: a
      # green run MEANS every swept sensor is in the image, and a define
      # that falls out of the override fails ITS OWN line by name.
      - name: Prove every swept sensor left its string in the binary
        run: |
          BIN=.pio/build/tasmota32/firmware.bin
          [ -f "$BIN" ] || BIN=.pio/build/tasmota32/tasmota32.bin
          [ -f "$BIN" ] || BIN=$(ls build_output/firmware/tasmota32.bin 2>/dev/null | head -1)
          test -f "$BIN" || { echo "::error::no built binary found to string-check"; exit 1; }
          echo "checking strings in: $BIN"
          FAILED=0
          embeds() {  # embeds <label> <string only the driver carries>
            if grep -aiq -- "$2" "$BIN"; then
              echo "in: $1"
            else
              echo "::error::$1 is NOT in this build -- its define fell out of tasmota/user_config_override.h"
              FAILED=1
            fi
          }
          embeds "SHT3x"          'SHT3X'
          embeds "AHT2x"          'AHT2'
          embeds "HTU21/SI7021"   'HTU21'
          embeds "AM2320"         'AM2320'
          embeds "BMP/BME280"     'BMP280'
          embeds "BME680"         'BME680'
          embeds "MLX90614"       'MLX90614'
          embeds "Seesaw soil"    'eesaw'
          embeds "Chirp soil"     'hirp'
          embeds "VL53L0X"        'VL53L0X'
          embeds "VL53L1X"        'VL53L1X'
          embeds "QMC5883L"       'QMC5883L'
          embeds "HMC5883L"       'HMC5883L'
          embeds "ADS1115"        'ADS1115'
          embeds "INA226"         'INA226'
          embeds "AS3935"         'AS3935'
          embeds "SGP30"          'SGP30'
          embeds "CCS811"         'CCS811'
          embeds "SCD30"          'SCD30'
          embeds "SCD40"          'SCD4'
          embeds "SEN5x"          'SEN5'
          embeds "VEML7700"       'VEML7700'
          embeds "VEML6070"       'VEML6070'
          embeds "SI1145"         'SI1145'
          embeds "MAX44009"       'MAX44009'
          embeds "BH1750"         'BH1750'
          embeds "SSD1306 OLED"   'SSD1306'
          embeds "HX711 scale"    'HX711'
          embeds "PMS5003"        'PMS5003'
          embeds "MH-Z19"         'MHZ19'
          embeds "SDS011"         'SDS0'
          exit $FAILED

      # Tasmota's build normally copies finished binaries to
      # build_output/firmware/; the raw PlatformIO output dir is included
      # too in case a version puts them only there. Either way the artifact
      # carries both the OTA image (tasmota32.bin) and the factory image
      # (tasmota32.factory.bin).
      - name: Collect the binaries
        uses: actions/upload-artifact@v5
        with:
          name: tasmota32-homevoice
          path: |
            build_output/firmware/*
            .pio/build/tasmota32/tasmota32*.bin
          if-no-files-found: error
